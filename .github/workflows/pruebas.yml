# Pruebas automáticas en cada push a main: lint, pruebas de la API (Vitest)
# y pruebas de punta a punta en Chromium, Firefox, WebKit y dos teléfonos (Playwright).
name: Pruebas en navegadores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    # Versión fija de Ubuntu: "ubuntu-latest" ya apunta a Ubuntu 26.04, que
    # Playwright 1.56 no soporta (no puede instalar los navegadores ahí).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Pruebas de punta a punta (5 navegadores)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14
